name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # 수동 실행이거나 CI가 성공한 경우에만 배포한다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: FLYWAYREDIS
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: 배포할 코드 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: 이미지 빌드 및 Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flywayredis:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flywayredis:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 서버에 배포
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH DOCKERHUB_USERNAME IMAGE_TAG; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing or empty"
              exit 1
            fi
          done

          if [[ ! "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::SSH_HOST must contain only an IP or hostname"
            exit 1
          fi

          if [[ ! "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::SSH_USER has an invalid format"
            exit 1
          fi

          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::DOCKERHUB_USERNAME has an invalid format"
            exit 1
          fi

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::IMAGE_TAG must be a full Git commit SHA"
            exit 1
          fi

          install -d -m 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" |
            tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" |
            tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if ! ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" >/dev/null; then
            echo "::error::SSH_PRIVATE_KEY is not a valid private key"
            exit 1
          fi

          if ! ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::SSH_KNOWN_HOSTS does not contain SSH_HOST"
            exit 1
          fi

          ssh -v -i "$RUNNER_TEMP/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${SSH_USER}@${SSH_HOST}" \
            "cd '$DEPLOY_PATH' && \
             git pull --ff-only origin main && \
             DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' APP_VERSION='$IMAGE_TAG' docker compose --env-file .env.prod -f docker-compose.prod.yml config --quiet && \
             DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' APP_VERSION='$IMAGE_TAG' docker compose --env-file .env.prod -f docker-compose.prod.yml pull app nginx && \
             DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' APP_VERSION='$IMAGE_TAG' docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-build --remove-orphans"
