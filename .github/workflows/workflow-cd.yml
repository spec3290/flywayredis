name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # 수동 실행이거나 CI가 성공한 경우에만 배포한다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: FLYWAYREDIS
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: 배포할 코드 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: 이미지 빌드 및 Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flywayredis:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flywayredis:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 배포 설정 검증
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          DEPLOY_REGION: ${{ secrets.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          for name in AWS_ROLE_ARN DEPLOY_REGION EC2_INSTANCE_ID DEPLOY_PATH DOCKERHUB_USERNAME IMAGE_TAG; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing or empty"
              exit 1
            fi
          done

          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo "::error::AWS_ROLE_ARN has an invalid format"
            exit 1
          fi

          if [[ ! "$DEPLOY_REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]+$ ]]; then
            echo "::error::AWS_REGION has an invalid format"
            exit 1
          fi

          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "::error::EC2_INSTANCE_ID has an invalid format"
            exit 1
          fi

          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "$DEPLOY_PATH" == *".."* ]]; then
            echo "::error::DEPLOY_PATH must be a safe absolute path"
            exit 1
          fi

          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::DOCKERHUB_USERNAME has an invalid format"
            exit 1
          fi

          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::IMAGE_TAG must be a full Git commit SHA"
            exit 1
          fi

      - name: AWS 임시 자격 증명 발급
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: flywayredis-${{ github.run_id }}

      - name: SSM으로 서버에 배포
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<EOF
          set -euo pipefail
          DEPLOY_PATH='$DEPLOY_PATH'
          runuser -u ubuntu -- git -C "\$DEPLOY_PATH" pull --ff-only origin main
          cd "\$DEPLOY_PATH"
          export DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME'
          export APP_VERSION='$IMAGE_TAG'
          docker compose --env-file .env.prod -f docker-compose.prod.yml config --quiet
          docker compose --env-file .env.prod -f docker-compose.prod.yml pull app nginx
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-build --remove-orphans

          for attempt in \$(seq 1 90); do
            if curl --fail --silent --show-error \
                http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
              echo "Application health check passed on attempt \$attempt"
              exit 0
            fi

            echo "Health check attempt \$attempt/90 - waiting for application..."
            sleep 2
          done

          echo "Application health check failed after 180 seconds" >&2
          docker compose --env-file .env.prod -f docker-compose.prod.yml ps >&2
          docker compose --env-file .env.prod -f docker-compose.prod.yml logs --tail 200 app nginx >&2
          exit 1
          EOF
          )

          PARAMETERS=$(jq -cn --arg command "$DEPLOY_SCRIPT" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy flywayredis $IMAGE_TAG" \
            --timeout-seconds 600 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"
          STATUS="Pending"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                break
                ;;
              Pending|InProgress|Delayed|"")
                sleep 5
                ;;
              *)
                break
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM deployment failed with status $STATUS"
            exit 1
          fi
