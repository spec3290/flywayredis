spring:
  application:
    name: flywayredis

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: update

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user

jwt:
  issuer: flywayredis
  access-token-expiration: 30m
  refresh-token-expiration: 14d
  secret: ${JWT_SECRET}

app:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  oauth2:
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:/auth/me}
  websocket:
    allowed-origin-pattern: ${FRONTEND_ORIGIN_PATTERN:http://localhost:*}
